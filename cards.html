<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>화투 48장 · 고스톱</title>
    <meta name="description" content="고스톱에 쓰이는 화투 48장 전체 — 월별 광·열끗·띠·피 구성과 점수." />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
      .lede { color: var(--ink-dim); font-size: 0.9rem; line-height: 1.7; }
      .month {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .month h2 { margin: 0 0 4px; font-size: 1rem; color: var(--gold); }
      .month .sub { font-size: 0.75rem; color: var(--ink-dim); margin-bottom: 10px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; }
      .cell { display: grid; gap: 5px; justify-items: center; }
      .cell .card { width: 96px; cursor: default; }
      .cell figcaption { font-size: 0.7rem; color: var(--ink-dim); text-align: center; max-width: 100px; }
      .back-link { display: inline-block; margin-bottom: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="btn back-link" href="index.html">← 게임으로</a>
      <h1 style="font-size: 1.3rem">화투 48장</h1>
      <p class="lede">
        열두 달, 달마다 넉 장. <b>광</b> 5장, <b>열끗</b> 9장, <b>띠</b> 10장, <b>피</b> 24장입니다.
        짝은 오직 같은 <b>월</b>끼리만 맞습니다.
      </p>
      <div id="grid"></div>
    </div>
    <script type="module">
      import { DECK, MONTHS, TYPE_LABEL } from './js/cards.js';
      import { cardSVG } from './js/art.js';

      const grid = document.getElementById('grid');
      for (const m of MONTHS) {
        const cards = DECK.filter((c) => c.month === m.n);
        const sec = document.createElement('section');
        sec.className = 'month';
        const kinds = cards.map((c) => (c.pi === 2 ? '쌍피' : TYPE_LABEL[c.type])).join(' · ');
        sec.innerHTML = `<h2>${m.n}월 ${m.name}</h2><div class="sub">${m.plant} · ${kinds}</div>`;
        const row = document.createElement('div');
        row.className = 'row';
        for (const c of cards) {
          const fig = document.createElement('figure');
          fig.className = 'cell';
          fig.style.margin = '0';
          const box = document.createElement('div');
          box.className = 'card';
          box.innerHTML = cardSVG(c);
          const cap = document.createElement('figcaption');
          cap.textContent = c.name + (c.pi === 2 ? ' (2장)' : '');
          fig.append(box, cap);
          row.append(fig);
        }
        sec.append(row);
        grid.append(sec);
      }
    </script>
  </body>
</html>
